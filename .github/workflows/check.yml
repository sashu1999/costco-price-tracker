name: Check prices

on:
  schedule:
    - cron: "52 12 */2 * *"   # every 2 days, 8:52am Eastern (EDT)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/items.json, data/config.json]

permissions:
  contents: write
  issues: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check prices
        run: python tracker/run.py

      - name: Save results
        run: |
          git config user.name "price-check-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json data/coupons.json
          git diff --cached --quiet || git commit -m "Price check $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Open an issue for drops
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Costco price drop $(date -u +%F)" --body-file alert.md
